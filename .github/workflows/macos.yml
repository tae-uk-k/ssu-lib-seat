name: macOS 앱 만들기

# 릴리스가 올라오면 맥용 앱을 만들어 그 릴리스에 붙인다. (macOS 앱은 맥에서만 만들 수 있어서 GitHub 의 맥으로 만든다.)
# 실패했거나 다시 만들고 싶으면: Actions 탭 > 이 워크플로 > Run workflow 에서 릴리스 태그(예: v1.0.6)를 넣는다.
# 릴리스에 올리지 않고 빌드만 시험하고 싶으면: 태그를 비워 두고 Run workflow 를 누른다 (만든 압축 파일은 이 실행의 Artifacts 에 남는다).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "앱을 붙일 릴리스 태그 (예: v1.0.6). 비워 두면 빌드만 시험하고 릴리스에는 올리지 않아요"
        required: false
        default: ""

permissions:
  contents: write # 릴리스에 파일을 올리려면 필요하다

jobs:
  macos:
    runs-on: macos-latest
    env:
      # 릴리스가 공개되면 그 태그, 직접 실행했으면 입력한 태그. 둘 다 없으면 시험 빌드다.
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: 태그 모양 확인
        if: ${{ env.RELEASE_TAG != '' }}
        run: |
          case "$RELEASE_TAG" in v[0-9]*) ;; *) echo "태그 모양이 이상해요: '$RELEASE_TAG'"; exit 1 ;; esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG || github.sha }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.4
          cache: true

      - run: flutter pub get

      - name: 맥용 앱 만들기
        run: |
          # 버전은 태그에서, 시험 빌드면 pubspec 에서 가져온다.
          if [ -n "$RELEASE_TAG" ]; then VERSION="${RELEASE_TAG#v}"; else VERSION="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"; fi
          BUILD="$(grep '^version:' pubspec.yaml | sed 's/.*+//')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          flutter build macos --release --build-name "$VERSION" --build-number "$BUILD"

      - name: 압축하기
        run: |
          APP="$(ls -d build/macos/Build/Products/Release/*.app | head -n 1)"
          echo "만들어진 앱: $APP"
          mkdir -p stage/SSU-LibSeat
          cp -R "$APP" stage/SSU-LibSeat/
          cat > stage/SSU-LibSeat/읽어주세요.txt <<'EOF'
          도서관 좌석 예약 (macOS)

          처음 쓰는 방법
          1. 압축을 풀면 나오는 앱(SsuLibSeat)을 "응용 프로그램" 폴더로 옮겨 주세요.
          2. 처음 실행하면 "확인되지 않은 개발자" 안내가 떠요. 서명하지 않은 앱이라 처음 한 번 나오는 안내예요.
             - 시스템 설정 > 개인정보 보호 및 보안 으로 가서, 아래쪽의 "그래도 열기" 를 눌러 주세요.
             - 그래도 안 열리면 터미널에서 아래 한 줄을 실행한 뒤 다시 열어 주세요.
               xattr -dr com.apple.quarantine /Applications/SsuLibSeat.app
          3. 알림 허용 창이 뜨면 "허용" 을 눌러 주세요. 예약이 끝났다는 알림을 받으려면 필요해요.
          4. 학번과 비밀번호는 이 맥의 키체인에 저장돼요. 어디로도 전송되지 않아요.

          알아둘 점
          - 예약이 도는 동안 창을 닫으면 예약도 멈춰요. 창을 가리거나 최소화하는 건 괜찮아요.
          - 예약하는 동안에는 맥이 잠자기에 들어가지 않아요.
          - 새 버전이 나오면 앱 맨 위에 안내가 떠요. 다운로드 페이지에서 새 압축 파일을 받아 같은 방법으로 풀어 주세요.
          EOF
          # ditto 로 묶어야 앱 안의 바로가기(심볼릭 링크)와 속성이 망가지지 않는다.
          ditto -c -k --keepParent stage/SSU-LibSeat "ssu-lib-seat-${VERSION}-macos.zip"
          ls -lh "ssu-lib-seat-${VERSION}-macos.zip"

      - name: 앱 구조 확인 (실행 파일과 Info.plist 가 있는지)
        run: |
          APP="$(ls -d stage/SSU-LibSeat/*.app | head -n 1)"
          test -x "$APP/Contents/MacOS/$(basename "$APP" .app)" || { echo "실행 파일이 없어요"; ls -R "$APP/Contents/MacOS"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"
          lipo -info "$APP/Contents/MacOS/$(basename "$APP" .app)" || true

      - name: 압축 파일 보관 (시험 빌드 확인용)
        uses: actions/upload-artifact@v4
        with:
          name: ssu-lib-seat-macos
          path: ssu-lib-seat-*-macos.zip
          retention-days: 7

      - name: 릴리스에 올리기
        if: ${{ env.RELEASE_TAG != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" "ssu-lib-seat-${VERSION}-macos.zip" --clobber
